<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Anggota - Bikers Touring Indonesia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        :root {
            --primary: #062A42; --primary-light: #0a3d5c; --primary-dark: #041e2e;
            --accent: #E62129; --accent-hover: #c91a21; --accent-light: #ff4d54;
            --white: #ffffff; --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
            --gray-300: #cbd5e1; --gray-400: #94a3b8; --gray-500: #64748b; --gray-600: #475569;
            --gray-700: #334155; --gray-800: #1e293b; --gray-900: #0f172a;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
            --font-heading: "Franklin Gothic ITC", "Libre Franklin", "Arial Narrow", Arial, sans-serif;
            --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
            --radius-lg: 16px; --radius-xl: 24px; --radius-full: 9999px;
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            --transition-base: 0.3s ease;
        }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); padding: 2rem 1rem; }
        .auth-card { background: var(--white); border-radius: var(--radius-xl); padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: var(--shadow-xl); }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-header .logo-icon { width: 60px; height: 60px; margin: 0 auto 1rem; color: var(--accent); }
        .auth-header h1 { font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem; }
        .auth-header p { font-family: var(--font-body); color: var(--gray-500); font-size: 0.9rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-family: var(--font-heading); font-size: 0.85rem; font-weight: 600; color: var(--gray-700); margin-bottom: 0.5rem; }
        .form-input { width: 100%; padding: 0.85rem 1rem; border: 2px solid var(--gray-200); border-radius: var(--radius-lg); font-family: var(--font-body); font-size: 0.95rem; color: var(--gray-800); background: var(--white); transition: var(--transition-base); }
        .form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(230, 33, 41, 0.1); }
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-family: var(--font-body); font-size: 0.85rem; }
        .remember-me { display: flex; align-items: center; gap: 0.5rem; color: var(--gray-600); cursor: pointer; }
        .forgot-link { color: var(--accent); font-weight: 600; }
        .btn-submit { width: 100%; padding: 1rem; background: var(--accent); color: var(--white); border: none; border-radius: var(--radius-full); font-family: var(--font-heading); font-size: 1rem; font-weight: 700; cursor: pointer; transition: var(--transition-base); }
        .btn-submit:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(230, 33, 41, 0.35); }
        .auth-footer { text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-100); }
        .auth-footer p { font-family: var(--font-body); color: var(--gray-500); font-size: 0.9rem; }
        .auth-footer a { color: var(--accent); font-weight: 700; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: rgba(255,255,255,0.7); margin-bottom: 1.5rem; font-family: var(--font-body); font-size: 0.9rem; }
        .back-link:hover { color: var(--white); }
        .alert { padding: 1rem 1.25rem; border-radius: var(--radius-lg); font-family: var(--font-body); font-size: 0.9rem; display: none; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
        .alert-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .alert-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body>
    <div class="auth-page">
        <div>
            <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo-icon">
                        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="28" stroke="currentColor" stroke-width="3"/><path d="M15 35C15 35 20 20 30 20C40 20 45 35 45 35" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="38" r="5" stroke="currentColor" stroke-width="2.5"/><circle cx="40" cy="38" r="5" stroke="currentColor" stroke-width="2.5"/><path d="M25 38H35" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </div>
                    <h1>Masuk Anggota</h1>
                    <p>Masuk ke portal anggota BTI</p>
                </div>
                <div class="alert alert-danger" id="errorAlert"><i class="fas fa-exclamation-circle"></i> <span id="errorMsg">Username atau password salah</span></div>
                <div class="alert alert-warning" id="warningAlert"><i class="fas fa-exclamation-triangle"></i> <span id="warningMsg">Akun Anda belum aktif. Silakan tunggu verifikasi.</span></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="username" placeholder="Masukkan username" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="password" placeholder="Masukkan password" required>
                    </div>
                    <div class="form-options">
                        <label class="remember-me"><input type="checkbox" id="remember"> <span>Ingat saya</span></label>
                        <a href="#" class="forgot-link">Lupa Password?</a>
                    </div>
                    <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Masuk</button>
                </form>
                <div class="auth-footer">
                    <p>Belum punya akun? <a href="register.html">Daftar Sekarang</a></p>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            const warningAlert = document.getElementById('warningAlert');
            errorAlert.style.display = 'none';
            warningAlert.style.display = 'none';
            if (!username || !password) {
                document.getElementById('errorMsg').textContent = 'Username dan Password wajib diisi';
                errorAlert.style.display = 'flex';
                return;
            }
            if (username === 'demo' && password === 'demo') {
                alert('Selamat datang di Member Dashboard BTI! (Demo)');
            } else if (username === 'pending' && password === 'pending') {
                warningAlert.style.display = 'flex';
            } else {
                document.getElementById('errorMsg').textContent = 'Username atau password salah';
                errorAlert.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
